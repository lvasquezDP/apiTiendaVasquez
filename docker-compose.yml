services:
  db:
    image: postgres:15.3
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: posgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tienda_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: